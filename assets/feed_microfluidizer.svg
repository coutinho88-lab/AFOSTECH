<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chamberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="800" height="480" fill="url(#bgVid)"/>

  <!-- Top Video Overlay Tag -->
  <rect x="40" y="30" width="170" height="32" rx="6" fill="#dc2626"/>
  <circle cx="56" cy="46" r="5" fill="#ffffff"/>
  <text x="68" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="1">LIVE PILOT DEMO</text>

  <rect x="220" y="30" width="220" height="32" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="235" y="52" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1,800 BAR MICRO-CHANNEL</text>

  <!-- Center Microfluidizer Diagram -->
  <g transform="translate(400, 230)">
    <!-- Main High-Pressure Interaction Chamber -->
    <rect x="-260" y="-80" width="520" height="160" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Inlet: Macro Emulsion (Large droplets) -->
    <g transform="translate(-180, 0)">
      <circle cx="-30" cy="-30" r="24" fill="#fbbf24" opacity="0.8"/>
      <circle cx="-10" cy="20" r="28" fill="#fbbf24" opacity="0.8"/>
      <circle cx="20" cy="-10" r="20" fill="#fbbf24" opacity="0.8"/>
      <text x="-10" y="60" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Macro Droplets (5–20 µm)</text>
    </g>

    <!-- Arrow Into Jet Nozzle -->
    <path d="M-90,0 L-40,0" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

    <!-- Y-Split Jet Collision Zone -->
    <circle cx="0" cy="0" r="42" fill="url(#chamberGrad)" filter="url(#glow)" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">💥</text>
    <text x="0" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">1,800 Bar Impact Shear</text>

    <!-- Outlet: Nano Droplets (Homogeneous sub-150nm) -->
    <g transform="translate(180, 0)">
      <circle cx="-40" cy="-20" r="4" fill="#67e8f9"/>
      <circle cx="-30" cy="15" r="5" fill="#67e8f9"/>
      <circle cx="-15" cy="-35" r="4" fill="#67e8f9"/>
      <circle cx="0" cy="5" r="4" fill="#67e8f9"/>
      <circle cx="10" cy="-25" r="5" fill="#67e8f9"/>
      <circle cx="25" cy="20" r="4" fill="#67e8f9"/>
      <circle cx="35" cy="-10" r="4" fill="#67e8f9"/>
      <circle cx="50" cy="10" r="5" fill="#67e8f9"/>
      <text x="10" y="60" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Nano-Droplets (&lt;150 nm)</text>
    </g>
  </g>

  <!-- Big Play Button Overlay -->
  <circle cx="400" cy="230" r="38" fill="rgba(0,0,0,0.65)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <polygon points="392,214 416,230 392,246" fill="#ffffff"/>

  <!-- Video Player Bottom Bar -->
  <g transform="translate(40, 420)">
    <rect width="720" height="36" rx="8" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">▶ 01:42 / 03:15</text>
    <!-- Progress bar -->
    <rect x="150" y="15" width="480" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="150" y="15" width="260" height="6" rx="3" fill="#38bdf8"/>
    <circle cx="410" cy="18" r="6" fill="#ffffff"/>
    <text x="650" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1080p HD</text>
  </g>
</svg>
