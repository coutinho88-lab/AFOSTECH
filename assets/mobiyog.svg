<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="mobi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#mobi-bg)"/>
  
  <!-- Bottle and Glass with camel milk ferment -->
  <g transform="translate(190, 80)">
    <!-- Shadow -->
    <ellipse cx="110" cy="240" rx="100" ry="20" fill="#0c4a6e" fill-opacity="0.4"/>
    
    <!-- Probiotic Bottle -->
    <rect x="50" y="70" width="80" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="65" y="45" width="50" height="30" rx="6" fill="#0284c7"/>
    <rect x="70" y="32" width="40" height="15" rx="4" fill="#38bdf8"/>
    <!-- Liquid Level -->
    <rect x="53" y="100" width="74" height="116" rx="12" fill="#e0f2fe"/>
    
    <!-- Bottle Label -->
    <rect x="55" y="115" width="70" height="75" rx="6" fill="#0369a1"/>
    <text x="90" y="140" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">MobiYog</text>
    <text x="90" y="155" font-family="sans-serif" font-weight="700" font-size="8" fill="#bae6fd" text-anchor="middle">CAMEL + BAOBAB</text>
    <text x="90" y="172" font-family="sans-serif" font-weight="800" font-size="9" fill="#facc15" text-anchor="middle">2.4B CFU/ml</text>

    <!-- Glass with probiotic swirl -->
    <path d="M145 120 L155 220 L195 220 L205 120 Z" fill="#ffffff" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M148 135 L157 215 L193 215 L202 135 Z" fill="#f0f9ff"/>
    <!-- Probiotic microbe icons -->
    <circle cx="170" cy="165" r="4" fill="#0284c7"/>
    <circle cx="185" cy="180" r="5" fill="#38bdf8"/>
    <circle cx="165" cy="195" r="3" fill="#0369a1"/>
    
    <!-- Baobab fruit badge -->
    <g transform="translate(180, 50)">
      <circle cx="20" cy="20" r="26" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
      <text x="20" y="27" font-family="sans-serif" font-size="20" text-anchor="middle">🥥</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="180" height="36" rx="18" fill="#000000" fill-opacity="0.35"/>
  <circle cx="48" cy="48" r="7" fill="#38bdf8"/>
  <text x="64" y="53" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">SYNBIOTIC DAIRY</text>

  <!-- University badge -->
  <rect x="420" y="30" width="150" height="36" rx="18" fill="#ffffff"/>
  <text x="495" y="53" font-family="sans-serif" font-weight="800" font-size="14" fill="#1d4ed8" text-anchor="middle">UON NAIROBI</text>

  <!-- Overlay Title -->
  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">MobiYog: Synbiotic Ferment</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#bae6fd">Camel Milk + Wild Baobab Prebiotic Matrix (30-day Ambient Shelf-Life)</text>
</svg>
