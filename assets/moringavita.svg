  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">MoringaVita: Iron Seasoning</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#e0e7ff">Nano-Encapsulated Iron &amp; Fermented Locust Bean (12mg Iron/Cube)</text>
