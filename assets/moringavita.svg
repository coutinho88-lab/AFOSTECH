      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#moringa-bg)"/>
  <g transform="translate(190, 90)">
    <ellipse cx="110" cy="220" rx="100" ry="20" fill="#1e1b4b" fill-opacity="0.5"/>
