<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <!-- Flagship Green & Cyan Biotech Gradient -->
    <linearGradient id="afostech-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Warm Harvest Gold Gradient -->
    <linearGradient id="harvest-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <!-- Fresh Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Official Flagship Emblem: White & Green with Golden Accent -->
  <g transform="translate(10, 8)" filter="url(#logo-glow)">
    <!-- Outer Emerald Seal Ring -->
    <circle cx="32" cy="32" r="30" fill="url(#afostech-green-grad)" />
    <!-- Crisp White Inner Disc (Flagship White) -->
    <circle cx="32" cy="32" r="26" fill="#ffffff" />
    
    <!-- Botanical Wheat & Leaf Emblem -->
    <!-- Left Leaf -->
    <path d="M32 38 C22 36, 18 26, 21 17 C26 25, 32 31, 32 38 Z" fill="url(#leaf-grad)"/>
    <!-- Right Leaf -->
    <path d="M32 38 C42 36, 46 26, 43 17 C38 25, 32 31, 32 38 Z" fill="url(#leaf-grad)"/>
    <!-- Central Golden Wheat Sheaf / Seed of Science -->
    <path d="M32 12 C30 18, 29 28, 32 38 C35 28, 34 18, 32 12 Z" fill="url(#harvest-gold)"/>
    <circle cx="32" cy="14" r="2.5" fill="#f59e0b"/>
    <circle cx="32" cy="21" r="2" fill="#d97706"/>
    <circle cx="32" cy="28" r="2" fill="#d97706"/>
    
    <!-- Erlenmeyer Flask Overlay (Technology & Labs) -->
    <path d="M29 36 L35 36 L40 50 C40.8 51.8, 39.5 53.5, 37.5 53.5 L26.5 53.5 C24.5 53.5, 23.2 51.8, 24 50 Z" fill="#0284c7" fill-opacity="0.9"/>
    <!-- Liquid in Flask -->
    <path d="M25.5 47 L38.5 47 L37.5 52 L26.5 52 Z" fill="#38bdf8"/>
    <circle cx="30" cy="49" r="1.2" fill="#ffffff"/>
    <circle cx="34" cy="48" r="0.8" fill="#ffffff"/>
    <!-- Flask Neck Lip -->
    <rect x="28" y="34" width="8" height="2" rx="1" fill="#0369a1"/>
  </g>

  <!-- Typography: High-End Collegiate Official -->
  <text x="84" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="900" letter-spacing="1">
    <tspan fill="#064e3b">AFOS</tspan><tspan fill="#059669">TECH</tspan>
  </text>
  
  <text x="84" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.8" font-weight="800" letter-spacing="1.2" fill="#475569" text-transform="uppercase">
    Association of Food Science &amp; Technology Students
  </text>
  
  <!-- Engaging Multi-Colour Academic Ribbon (Flagship Green, Gold, Azure, Coral) -->
  <g transform="translate(84, 58)">
    <rect x="0" y="0" width="70" height="3.5" rx="1.75" fill="#059669"/>
    <rect x="74" y="0" width="55" height="3.5" rx="1.75" fill="#f59e0b"/>
    <rect x="133" y="0" width="55" height="3.5" rx="1.75" fill="#0284c7"/>
    <rect x="192" y="0" width="45" height="3.5" rx="1.75" fill="#f43f5e"/>
  </g>
</svg>
