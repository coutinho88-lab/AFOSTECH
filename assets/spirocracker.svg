<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="spiro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="spiro-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#spiro-bg)"/>
  <circle cx="300" cy="200" r="180" fill="url(#spiro-glow)"/>
  
  <!-- Wafer Biscuit Stack Graphic -->
  <g transform="translate(180, 110)">
    <!-- Shadow -->
    <ellipse cx="120" cy="200" rx="110" ry="25" fill="#022c22" fill-opacity="0.5"/>
    
    <!-- Wafer 1 (Bottom) -->
    <rect x="25" y="140" width="190" height="35" rx="8" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <line x1="45" y1="140" x2="45" y2="175" stroke="#b45309" stroke-width="2"/>
    <line x1="85" y1="140" x2="85" y2="175" stroke="#b45309" stroke-width="2"/>
    <line x1="125" y1="140" x2="125" y2="175" stroke="#b45309" stroke-width="2"/>
    <line x1="165" y1="140" x2="165" y2="175" stroke="#b45309" stroke-width="2"/>

    <!-- Spirulina Green Cream Layer -->
    <rect x="30" y="115" width="180" height="28" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <circle cx="60" cy="129" r="4" fill="#047857"/>
    <circle cx="100" cy="129" r="4" fill="#047857"/>
    <circle cx="140" cy="129" r="4" fill="#047857"/>
    <circle cx="180" cy="129" r="4" fill="#047857"/>

    <!-- Wafer 2 (Top) with Crispy Texture Grid -->
    <rect x="20" y="70" width="200" height="48" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2.5"/>
    <!-- Honeycomb pattern -->
    <path d="M40 78 L50 86 L40 94 L30 86 Z M70 78 L80 86 L70 94 L60 86 Z M100 78 L110 86 L100 94 L90 86 Z M130 78 L140 86 L130 94 L120 86 Z M160 78 L170 86 L160 94 L150 86 Z M190 78 L200 86 L190 94 L180 86 Z" fill="#b45309" fill-opacity="0.4"/>
    <path d="M55 92 L65 100 L55 108 L45 100 Z M85 92 L95 100 L85 108 L75 100 Z M115 92 L125 100 L115 108 L105 100 Z M145 92 L155 100 L145 108 L135 100 Z M175 92 L185 100 L175 108 L165 100 Z" fill="#b45309" fill-opacity="0.4"/>

    <!-- Floating Sweet Potato & Spirulina badge -->
    <g transform="translate(160, 20)">
      <circle cx="20" cy="20" r="28" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
      <text x="20" y="27" font-family="sans-serif" font-size="22" text-anchor="middle">🍠</text>
    </g>
    <g transform="translate(-10, 40)">
      <circle cx="20" cy="20" r="28" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
      <text x="20" y="27" font-family="sans-serif" font-size="22" text-anchor="middle">🌿</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="30" width="170" height="36" rx="18" fill="#000000" fill-opacity="0.35"/>
  <circle cx="48" cy="48" r="7" fill="#10b981"/>
  <text x="64" y="53" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">BIOFORTIFIED TECH</text>

  <!-- University badge -->
  <rect x="440" y="30" width="130" height="36" rx="18" fill="#ffffff"/>
  <text x="505" y="53" font-family="sans-serif" font-weight="800" font-size="14" fill="#047857" text-anchor="middle">JKUAT KENYA</text>

  <!-- Overlay Title -->
  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">SpiroCracker™ Wafer</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#fde68a">Spirulina Platensis + Biofortified OFSP Micronutrient Blend</text>
</svg>
