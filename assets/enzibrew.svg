<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="enzi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#enzi-bg)"/>
  <g transform="translate(190, 80)">
    <ellipse cx="110" cy="240" rx="90" ry="20" fill="#022c22" fill-opacity="0.5"/>
    <!-- Glass bottle -->
    <path d="M75 50 L95 50 L95 75 L125 110 L125 220 L45 220 L45 110 L75 75 Z" fill="#991b1b" stroke="#fca5a5" stroke-width="2"/>
    <rect x="73" y="38" width="24" height="14" rx="3" fill="#d97706"/>
    <!-- Effervescent bubbles -->
    <circle cx="70" cy="180" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="95" cy="150" r="3" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="80" cy="130" r="5" fill="#ffffff" fill-opacity="0.6"/>
    <!-- Label -->
    <rect x="52" y="125" width="66" height="60" rx="4" fill="#fef3c7"/>
    <text x="85" y="145" font-family="sans-serif" font-weight="900" font-size="11" fill="#78350f" text-anchor="middle">EnziBrew</text>
    <text x="85" y="160" font-family="sans-serif" font-weight="700" font-size="7" fill="#92400e" text-anchor="middle">MILLET + SORGHUM</text>
    <text x="85" y="173" font-family="sans-serif" font-weight="800" font-size="8" fill="#047857" text-anchor="middle">LOW GI: 42</text>
    <!-- Sorghum ear illustration -->
    <g transform="translate(145, 100)">
      <path d="M10 90 Q30 50 20 10" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="16" cy="25" rx="5" ry="3" fill="#fef08a"/>
      <ellipse cx="26" cy="35" rx="5" ry="3" fill="#fef08a"/>
      <ellipse cx="18" cy="45" rx="5" ry="3" fill="#fef08a"/>
      <ellipse cx="28" cy="55" rx="5" ry="3" fill="#fef08a"/>
    </g>
  </g>
  <rect x="30" y="30" width="180" height="36" rx="18" fill="#000000" fill-opacity="0.35"/>
  <circle cx="48" cy="48" r="7" fill="#34d399"/>
  <text x="64" y="53" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">FUNCTIONAL BEV</text>
  <rect x="420" y="30" width="150" height="36" rx="18" fill="#ffffff"/>
  <text x="495" y="53" font-family="sans-serif" font-weight="800" font-size="14" fill="#047857" text-anchor="middle">EGERTON KENYA</text>
  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">EnziBrew: Low-GI Tonic</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#d1fae5">Malted Red Sorghum &amp; Finger Millet (Clinically Tested GI 42)</text>
