<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="progrub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#progrub-bg)"/>
  
  <g transform="translate(180, 100)">
    <ellipse cx="120" cy="220" rx="110" ry="22" fill="#1c0d02" fill-opacity="0.5"/>
    <!-- Cutting Board -->
    <rect x="20" y="160" width="200" height="24" rx="8" fill="#d97706"/>
    <rect x="18" y="180" width="204" height="6" rx="3" fill="#b45309"/>
    
    <!-- Plant-insect Sausage links -->
    <path d="M40 145 C40 120 180 120 180 145 C180 170 40 170 40 145 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Grill marks -->
    <line x1="70" y1="130" x2="85" y2="160" stroke="#450a0a" stroke-width="3"/>
    <line x1="100" y1="130" x2="115" y2="160" stroke="#450a0a" stroke-width="3"/>
    <line x1="130" y1="130" x2="145" y2="160" stroke="#450a0a" stroke-width="3"/>
    
    <!-- Slices showing striated texture -->
    <ellipse cx="205" cy="155" rx="14" ry="24" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
    <ellipse cx="205" cy="155" rx="9" ry="17" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,3"/>

    <g transform="translate(160, 20)">
      <circle cx="20" cy="20" r="26" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
      <text x="20" y="27" font-family="sans-serif" font-size="20" text-anchor="middle">🌱</text>
    </g>
  </g>

  <rect x="30" y="30" width="190" height="36" rx="18" fill="#000000" fill-opacity="0.35"/>
  <circle cx="48" cy="48" r="7" fill="#f59e0b"/>
  <text x="64" y="53" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">ALTERNATIVE PROTEIN</text>

  <rect x="420" y="30" width="150" height="36" rx="18" fill="#ffffff"/>
  <text x="495" y="53" font-family="sans-serif" font-weight="800" font-size="14" fill="#b45309" text-anchor="middle">KNUST GHANA</text>

  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">ProGrub: Mycomeat Sausage</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#fde68a">Larval Insect Protein + Jackfruit Striated Fiber (22.6g Protein/100g)</text>
</svg>
