<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="pulse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#pulse-bg)"/>
  <g transform="translate(190, 90)">
    <ellipse cx="110" cy="220" rx="100" ry="20" fill="#422006" fill-opacity="0.5"/>
    <!-- Glass Jar with golden emulsion gel -->
    <rect x="60" y="80" width="100" height="120" rx="16" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
    <rect x="70" y="60" width="80" height="22" rx="4" fill="#a16207"/>
    <!-- Emulsion swirls -->
    <path d="M70 120 Q110 100 150 120 Q110 140 70 120" fill="#fef08a"/>
    <path d="M70 150 Q110 130 150 150 Q110 170 70 150" fill="#fef08a"/>
    <!-- Bambara groundnut pods -->
    <g transform="translate(145, 140)">
      <ellipse cx="20" cy="20" rx="14" ry="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <ellipse cx="38" cy="22" rx="12" ry="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    </g>
  </g>
  <rect x="30" y="30" width="180" height="36" rx="18" fill="#000000" fill-opacity="0.35"/>
  <circle cx="48" cy="48" r="7" fill="#fef08a"/>
  <text x="64" y="53" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">HYDROCOLLOID TECH</text>
  <rect x="420" y="30" width="150" height="36" rx="18" fill="#ffffff"/>
  <text x="495" y="53" font-family="sans-serif" font-weight="800" font-size="14" fill="#854d0e" text-anchor="middle">KNUST GHANA</text>
  <text x="30" y="355" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">PulseGel: Bambara Stabilizer</text>
  <text x="30" y="380" font-family="sans-serif" font-size="14" font-weight="600" fill="#fef9c3">Thermostable Legume Emulsion Replacer (Baking &amp; Mayonnaise)</text>
</svg>
