<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgBio)"/>

  <!-- Top Badge -->
  <rect x="40" y="30" width="340" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
  <text x="56" y="51" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="12" font-weight="800">CIRCULAR FOOD PACKAGING TRIAL • DAY 14</text>

  <!-- Left: Synthetic Polyethylene (Moldy Strawberry) -->
  <g transform="translate(180, 230)" filter="url(#cardShadow)">
    <rect x="-110" y="-130" width="220" height="260" rx="16" fill="#ffffff"/>
    <rect x="-95" y="-115" width="190" height="150" rx="10" fill="#fee2e2"/>
    <text x="0" y="-35" text-anchor="middle" font-size="52">🍓</text>
    <text x="0" y="5" text-anchor="middle" font-size="28">🦠</text>
    <text x="0" y="55" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="900">Standard Cling Wrap</text>
    <text x="0" y="75" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Fungal sporulation at Day 4</text>
    <rect x="-70" y="90" width="140" height="24" rx="12" fill="#fee2e2"/>
    <text x="0" y="106" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Condensed Moisture</text>
  </g>

  <!-- Right: BioChito-Wrap Chitosan Mango Film (Fresh Strawberry) -->
  <g transform="translate(620, 230)" filter="url(#cardShadow)">
    <rect x="-110" y="-130" width="220" height="260" rx="16" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
    <rect x="-95" y="-115" width="190" height="150" rx="10" fill="#ccfbf1"/>
    <!-- Translucent film overlay -->
    <rect x="-85" y="-105" width="170" height="130" rx="8" fill="url(#filmGrad)" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-30" text-anchor="middle" font-size="54">🍓</text>
    <text x="0" y="55" text-anchor="middle" fill="#0f766e" font-family="system-ui, sans-serif" font-size="13" font-weight="900">Chitosan-Mango Film</text>
    <text x="0" y="75" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Zero mold growth at Day 14!</text>
    <rect x="-80" y="90" width="160" height="24" rx="12" fill="#d1fae5"/>
    <text x="0" y="106" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Antimicrobial Barrier Active</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="32" fill="#14b8a6"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="900">3x</text>
    <text x="0" y="20" text-anchor="middle" fill="#ccfbf1" font-size="9" font-weight="700">LONGER</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="40" y="415" width="720" height="42" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="60" y="441" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">
    🥭 <tspan font-weight="800" fill="#5eead4">Mango Polyphenols + Chitosan Chitin:</tspan> Naturally inhibits Botrytis cinerea fungal hyphae while breathing moisture out!
  </text>
</svg>
