<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="avoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="avoFleshFresh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="70%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="avoFleshBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="lemonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="380" height="34" rx="17" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)"/>
  <text x="60" y="52" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1">FOOD CHEMISTRY LAB EXPERIMENT #14</text>

  <!-- Left Side: Unprotected Oxidation (Browning) -->
  <g transform="translate(180, 240)" filter="url(#shadow)">
    <!-- Avocado Skin -->
    <ellipse cx="0" cy="0" rx="110" ry="140" fill="url(#avoSkin)"/>
    <!-- Browned Flesh -->
    <ellipse cx="0" cy="0" rx="96" ry="124" fill="url(#avoFleshBrown)"/>
    <!-- Pit cavity -->
    <circle cx="0" cy="15" r="42" fill="#291205" opacity="0.6"/>
    <!-- PPO Melanin indicators -->
    <text x="0" y="-40" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="900">O₂ + Polyphenol Oxidase</text>
    <text x="0" y="-15" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12">Melanin Polymerization</text>
    <text x="0" y="75" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">❌ UNPROTECTED (25 MINS)</text>
  </g>

  <!-- VS Divider -->
  <circle cx="400" cy="240" r="32" fill="#ffffff" filter="url(#shadow)"/>
  <text x="400" y="247" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="18" font-weight="900">VS</text>

  <!-- Right Side: Citric Acid Protected (Fresh) -->
  <g transform="translate(620, 240)" filter="url(#shadow)">
    <!-- Avocado Skin -->
    <ellipse cx="0" cy="0" rx="110" ry="140" fill="url(#avoSkin)"/>
    <!-- Fresh Vibrant Green Flesh -->
    <ellipse cx="0" cy="0" rx="96" ry="124" fill="url(#avoFleshFresh)"/>
    <!-- Pit cavity -->
    <circle cx="0" cy="15" r="42" fill="#365314" opacity="0.4"/>
    <!-- Lemon juice layer -->
    <path d="M-60,-50 Q0,-80 60,-50 Q80,20 0,60 Q-80,20 -60,-50" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="6,4" opacity="0.9"/>
    <!-- Scientific Labels -->
    <text x="0" y="-40" text-anchor="middle" fill="#064e3b" font-family="system-ui, sans-serif" font-size="14" font-weight="900">pH &lt; 3.0 Inactivated PPO</text>
    <text x="0" y="-15" text-anchor="middle" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">Ascorbic Acid Anti-Oxidant</text>
    <text x="0" y="75" text-anchor="middle" fill="#ecfccb" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ LEMON JUICE TREATED</text>
  </g>

  <!-- Lemon wedge graphic floating top right -->
  <g transform="translate(560, 95) rotate(-20)">
    <path d="M0,0 L60,-35 A70,70 0 0,1 60,35 Z" fill="url(#lemonGrad)" stroke="#fef9c3" stroke-width="3"/>
    <text x="75" y="5" fill="#fef08a" font-family="system-ui, sans-serif" font-size="13" font-weight="900">+ Citric Acid</text>
  </g>

  <!-- Footer Caption Banner -->
  <rect x="40" y="415" width="720" height="42" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="441" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">
    🔬 <tspan font-weight="800" fill="#34d399">The Science:</tspan> Citric acid drops pH below PPO's optimum range (6.0–7.0), denaturing enzyme catalytic copper sites!
  </text>
</svg>
